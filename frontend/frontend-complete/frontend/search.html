<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Colleges | DSE-Compass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">
        <div class="logo">DC</div>
        DSE-Compass
      </a>
      <button class="nav-toggle" aria-label="Menu">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="search.html" class="active">Search</a></li>
        <li><a href="compare.html">Compare <span data-compare-count>0</span></a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="search-layout">
      <!-- Filter Sidebar -->
      <aside class="filter-panel">
        <h3>Filters <button class="btn btn-sm btn-ghost" id="btn-clear-filters" style="font-size:0.75rem;">Clear</button></h3>

        <div class="filter-group">
          <label for="filter-name">College Name</label>
          <input type="text" id="filter-name" placeholder="Search by name..." />
        </div>

        <div class="filter-group">
          <label for="filter-district">District</label>
          <select id="filter-district">
            <option value="">All Districts</option>
            <option value="Mumbai">Mumbai</option>
            <option value="Pune">Pune</option>
            <option value="Nagpur">Nagpur</option>
            <option value="Nashik">Nashik</option>
            <option value="Aurangabad">Aurangabad</option>
            <option value="Sangli">Sangli</option>
            <option value="Satara">Satara</option>
            <option value="Nanded">Nanded</option>
            <option value="Amravati">Amravati</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-type">College Type</label>
          <select id="filter-type">
            <option value="">All Types</option>
            <option value="Government">Government</option>
            <option value="Aided">Aided</option>
            <option value="Private">Private</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-branch">Branch</label>
          <select id="filter-branch">
            <option value="">All Branches</option>
            <option value="Computer">Computer Engineering</option>
            <option value="IT">Information Technology</option>
            <option value="E&TC">Electronics & TC</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Electrical">Electrical</option>
            <option value="Civil">Civil</option>
            <option value="AI">AI & Data Science</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Percentile / Cutoff Range</label>
          <div class="range-inputs">
            <input type="number" id="filter-min" placeholder="Min" min="40" max="100" value="50" step="0.1" />
            <span>to</span>
            <input type="number" id="filter-max" placeholder="Max" min="40" max="100" value="100" step="0.1" />
          </div>
        </div>
      </aside>

      <!-- Results -->
      <main>
        <div class="results-header">
          <div>
            <h2>Colleges</h2>
            <div class="results-count" id="results-count">Loading...</div>
          </div>
          <select id="sort-by" class="sort-select">
            <option value="cutoff-desc">Highest Cutoff</option>
            <option value="cutoff-asc">Lowest Cutoff</option>
            <option value="package-desc">Best Package</option>
            <option value="fees-asc">Lowest Fees</option>
            <option value="name-asc">Name A–Z</option>
          </select>
        </div>

        <div class="college-grid" id="college-grid">
          <!-- Cards rendered by JS -->
        </div>
      </main>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      DSE-Compass · Data is approximate — always verify official CAP PDFs
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
